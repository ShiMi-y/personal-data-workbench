name: Build Windows package

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: '版本号（留空则读取 config.example.json）'
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: windows-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller==6.21.0 openpyxl playwright cryptography xlrd

      - name: Resolve version
        shell: pwsh
        run: |
          $version = "${{ inputs.version }}".Trim()
          if (-not $version -and "${{ github.ref_type }}" -eq 'tag') {
            $version = "${{ github.ref_name }}".TrimStart('v')
          }
          if (-not $version) {
            $version = (Get-Content config.example.json -Raw | ConvertFrom-Json).version
          }
          if (-not $version) { throw '无法确定版本号' }
          $zipName = "personal-data-workbench-v$version-win64.zip"
          Add-Content -Path $env:GITHUB_ENV -Value "APP_VERSION=$version" -Encoding ascii
          Add-Content -Path $env:GITHUB_ENV -Value "ZIP_NAME=$zipName" -Encoding ascii
          $env:ZIP_NAME = $zipName
          Write-Host "version=$version"
          Write-Host "zip=$zipName"

      - name: Sync version into source
        shell: pwsh
        run: |
          $p = 'kx_core.py'
          $c = Get-Content $p -Raw
          $replacement = 'APP_VERSION = "' + $env:APP_VERSION + '"'
          $c = $c -replace 'APP_VERSION = "[^"]*"', $replacement
          Set-Content -Path $p -Value $c -Encoding utf8
          Select-String -Path $p -Pattern 'APP_VERSION' | Select-Object -First 1

      - name: Build with PyInstaller
        shell: pwsh
        env:
          PYTHONUTF8: '1'
        run: |
          $buildArgs = @(
            '--noconfirm','--clean','--onedir','--windowed',
            '--name','快手数据工作台',
            '--distpath','dist_ci','--workpath','build_ci',
            '--add-data','web;web',
            '--add-data','config.example.json;.',
            '--hidden-import','xlrd',
            '--exclude-module','PIL','--exclude-module','pandas','--exclude-module','matplotlib',
            '--exclude-module','tkinter','--exclude-module','numpy','--exclude-module','lxml',
            '--exclude-module','charset_normalizer'
          )
          if (Test-Path 'assets/app.ico') {
            $buildArgs += @('--icon','assets/app.ico','--add-data','assets;assets')
          }
          $buildArgs += 'web_server.py'
          python -m PyInstaller @buildArgs

      - name: Fetch previous manifest
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PYTHONUTF8: '1'
          PYTHONIOENCODING: utf-8
        run: |
          $ErrorActionPreference = 'Continue'
          [Console]::OutputEncoding = [System.Text.Encoding]::UTF8
          $prevTag = ''
          try {
            $list = gh release list --limit 20 --json tagName,isDraft | ConvertFrom-Json
            $cand = @($list) | Where-Object { -not $_.isDraft -and $_.tagName -ne "v$env:APP_VERSION" }
            if ($cand) { $prevTag = @($cand)[0].tagName }
          } catch { Write-Host "读取 Release 列表失败: $_" }
          Write-Host "上一版: $prevTag"
          if ($prevTag) {
            New-Item -ItemType Directory -Force -Path prev | Out-Null
            gh release download $prevTag -p manifest.json -D prev 2>$null
            if (Test-Path 'prev/manifest.json') {
              Add-Content -Path $env:GITHUB_ENV -Value "PREV_MANIFEST=prev/manifest.json" -Encoding ascii
              Add-Content -Path $env:GITHUB_ENV -Value "PREV_VERSION=$($prevTag.TrimStart('v'))" -Encoding ascii
              Write-Host "已取到上一版 manifest.json"
            } else {
              Write-Host "上一版没有 manifest.json，尝试从它的升级包现算"
              $prevVer = $prevTag.TrimStart('v')
              Add-Content -Path $env:GITHUB_ENV -Value "PREV_VERSION=$prevVer" -Encoding ascii
              gh release download $prevTag -p '*win64.zip' -D prev 2>$null
              $prevZip = Get-ChildItem 'prev' -Filter *.zip -ErrorAction SilentlyContinue | Select-Object -First 1
              if ($prevZip) {
                Expand-Archive -LiteralPath $prevZip.FullName -DestinationPath 'prev\unz' -Force
                $prevDist = 'prev\unz'
                $subs = @(Get-ChildItem -LiteralPath $prevDist -Directory -ErrorAction SilentlyContinue)
                if (-not (Test-Path (Join-Path $prevDist '快手数据工作台.exe')) -and $subs.Count -eq 1) {
                  $prevDist = $subs[0].FullName
                }
                python tools/make_update_assets.py --dist $prevDist --version $prevVer --out prev --manifest-only
                if (Test-Path 'prev\manifest.json') {
                  Add-Content -Path $env:GITHUB_ENV -Value "PREV_MANIFEST=prev/manifest.json" -Encoding ascii
                  Write-Host "已用上一版升级包生成清单，可产出增量包"
                } else {
                  Write-Host "上一版清单生成失败，本次只出全量"
                }
              } else {
                Write-Host "上一版没有 win64.zip，本次只出全量"
              }
            }
          }
          exit 0

      - name: Make manifest and delta
        shell: pwsh
        env:
          PYTHONUTF8: '1'
          PYTHONIOENCODING: utf-8
        run: |
          $deltaName = ""
          if ($env:PREV_VERSION) { $deltaName = "personal-data-workbench-v$env:APP_VERSION-from-v$env:PREV_VERSION-win64-delta.zip" }
          $params = @('tools/make_update_assets.py', '--dist', 'dist_ci\快手数据工作台',
                      '--version', $env:APP_VERSION, '--out', 'release')
          if ($env:PREV_MANIFEST) {
            $params += @('--prev-manifest', $env:PREV_MANIFEST, '--prev-version', $env:PREV_VERSION, '--delta-name', $deltaName)
          }
          python @params

      - name: Create zip
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release | Out-Null
          Compress-Archive -Path "dist_ci\快手数据工作台\快手数据工作台.exe", "dist_ci\快手数据工作台\_internal" `
            -DestinationPath "release\$env:ZIP_NAME" -CompressionLevel Optimal
          Get-Item "release\$env:ZIP_NAME" | Select-Object Name, Length
          (Get-FileHash "release\$env:ZIP_NAME" -Algorithm SHA256).Hash

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: personal-data-workbench-windows
          path: release/*.zip
          retention-days: 14

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = "${{ github.ref_name }}"
          $asset = "release\$env:ZIP_NAME"
          $files = @($asset)
          if (Test-Path 'release\manifest.json') { $files += 'release\manifest.json' }
          Get-ChildItem 'release' -Filter *.zip | ForEach-Object {
            if ($_.Name -ne $env:ZIP_NAME) { $files += $_.FullName }
          }
          Write-Host ("上传文件: " + ($files -join ', '))
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag $files --clobber
          } else {
            gh release create $tag $files --title $tag --generate-notes
          }

