name: Build Windows package

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: '版本号（留空则读取 config.example.json）'
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: windows-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller==6.21.0 openpyxl playwright cryptography xlrd

      - name: Resolve version
        shell: pwsh
        run: |
          $version = "${{ inputs.version }}".Trim()
          if (-not $version -and "${{ github.ref_type }}" -eq 'tag') {
            $version = "${{ github.ref_name }}".TrimStart('v')
          }
          if (-not $version) {
            $version = (Get-Content config.example.json -Raw | ConvertFrom-Json).version
          }
          if (-not $version) { throw '无法确定版本号' }
          $zipName = "personal-data-workbench-v$version-win64.zip"
          Add-Content -Path $env:GITHUB_ENV -Value "APP_VERSION=$version" -Encoding ascii
          Add-Content -Path $env:GITHUB_ENV -Value "ZIP_NAME=$zipName" -Encoding ascii
          $env:ZIP_NAME = $zipName
          Write-Host "version=$version"
          Write-Host "zip=$zipName"

      - name: Sync version into source
        shell: pwsh
        run: |
          $p = 'kx_core.py'
          $c = Get-Content $p -Raw
          $replacement = 'APP_VERSION = "' + $env:APP_VERSION + '"'
          $c = $c -replace 'APP_VERSION = "[^"]*"', $replacement
          Set-Content -Path $p -Value $c -Encoding utf8
          Select-String -Path $p -Pattern 'APP_VERSION' | Select-Object -First 1

      - name: Build with PyInstaller
        shell: pwsh
        env:
          PYTHONUTF8: '1'
        run: |
          $buildArgs = @(
            '--noconfirm','--clean','--onedir','--windowed',
            '--name','快手数据工作台',
            '--distpath','dist_ci','--workpath','build_ci',
            '--add-data','web;web',
            '--add-data','config.example.json;.',
            '--hidden-import','xlrd',
            '--exclude-module','PIL','--exclude-module','pandas','--exclude-module','matplotlib',
            '--exclude-module','tkinter','--exclude-module','numpy','--exclude-module','lxml',
            '--exclude-module','charset_normalizer'
          )
          if (Test-Path 'assets/app.ico') {
            $buildArgs += @('--icon','assets/app.ico','--add-data','assets;assets')
          }
          $buildArgs += 'web_server.py'
          python -m PyInstaller @buildArgs

      - name: Fetch line manifests
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PYTHONUTF8: '1'
          PYTHONIOENCODING: utf-8
        run: |
          $ErrorActionPreference = 'Continue'
          [Console]::OutputEncoding = [System.Text.Encoding]::UTF8
          $line = (($env:APP_VERSION -split '\.')[0..1] -join '.')
          Write-Host "版本线: $line"
          $tags = @()
          try {
            $list = gh release list --limit 100 --json tagName,isDraft | ConvertFrom-Json
            $tags = @($list) | Where-Object {
              -not $_.isDraft -and $_.tagName -ne "v$env:APP_VERSION" -and
              $_.tagName -match ("^v" + [regex]::Escape($line) + "\.")
            } | ForEach-Object { $_.tagName }
          } catch { Write-Host "读取 Release 列表失败: $_" }
          Write-Host ("同线版本: " + ($tags -join ', '))
          $manifests = New-Object System.Collections.ArrayList
          $prevVersion = ''
          foreach ($tag in $tags) {
            $ver = $tag.TrimStart('v')
            if (-not $prevVersion) { $prevVersion = $ver }
            $dir = "prev/$ver"
            New-Item -ItemType Directory -Force -Path $dir | Out-Null
            gh release download $tag -p manifest.json -D $dir 2>$null
            if (Test-Path "$dir/manifest.json") {
              [void]$manifests.Add("$dir/manifest.json")
              Write-Host "$tag 复用现成 manifest.json"
              continue
            }
            gh release download $tag -p '*win64.zip' -D $dir 2>$null
            $zip = Get-ChildItem $dir -Filter *.zip -ErrorAction SilentlyContinue | Select-Object -First 1
            if (-not $zip) { Write-Host "$tag 没有清单也没有 zip，跳过"; continue }
            $unz = "$dir/unz"
            Expand-Archive -LiteralPath $zip.FullName -DestinationPath $unz -Force
            $dist = $unz
            $subs = @(Get-ChildItem -LiteralPath $unz -Directory -ErrorAction SilentlyContinue)
            if (-not (Test-Path (Join-Path $unz '快手数据工作台.exe')) -and $subs.Count -eq 1) {
              $dist = $subs[0].FullName
            }
            python tools/make_update_assets.py --dist $dist --version $ver --out $dir --manifest-only
            if (Test-Path "$dir/manifest.json") {
              [void]$manifests.Add("$dir/manifest.json")
              Write-Host "$tag 用升级包现算清单完成"
            }
            Remove-Item -Recurse -Force $zip.FullName, $unz -ErrorAction SilentlyContinue
          }
          if ($prevVersion) {
            Add-Content -Path $env:GITHUB_ENV -Value "PREV_VERSION=$prevVersion" -Encoding ascii
            Add-Content -Path $env:GITHUB_ENV -Value "PREV_MANIFEST=prev/$prevVersion/manifest.json" -Encoding ascii
          }
          if ($manifests.Count -gt 0) {
            Add-Content -Path $env:GITHUB_ENV -Value ("PREV_MANIFESTS=" + ($manifests -join ';')) -Encoding ascii
            Add-Content -Path $env:GITHUB_ENV -Value "DELTA_FROM=$line.x" -Encoding ascii
            Write-Host ("共 " + $manifests.Count + " 个旧版本清单，将生成 from-v$line.x 增量包")
          } else {
            Write-Host "没有同线旧版本清单，本次只出全量"
          }
          exit 0

      - name: Make manifest and delta
        shell: pwsh
        env:
          PYTHONUTF8: '1'
          PYTHONIOENCODING: utf-8
        run: |
          $base = @('tools/make_update_assets.py', '--dist', 'dist_ci\快手数据工作台',
                    '--version', $env:APP_VERSION, '--out', 'release')
          # 1) 精确上一版增量包：给旧客户端（只认 from 精确版本）用
          if ($env:PREV_MANIFEST -and (Test-Path $env:PREV_MANIFEST)) {
            $name = "personal-data-workbench-v$env:APP_VERSION-from-v$env:PREV_VERSION-win64-delta.zip"
            python @base --prev-manifest $env:PREV_MANIFEST --prev-version $env:PREV_VERSION --delta-name $name
          }
          # 2) 版本线增量包：覆盖同一 1.X 线内所有补丁版
          if ($env:PREV_MANIFESTS) {
            $extra = @()
            foreach ($m in ($env:PREV_MANIFESTS -split ';')) { $extra += @('--prev-manifest', $m) }
            $name2 = "personal-data-workbench-v$env:APP_VERSION-from-v$env:DELTA_FROM-win64-delta.zip"
            python @base @extra --delta-from $env:DELTA_FROM --delta-name $name2
          }

      - name: Create zip
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release | Out-Null
          $zipItems = @("dist_ci\快手数据工作台\快手数据工作台.exe", "dist_ci\快手数据工作台\_internal")
          if (Test-Path 'release\manifest.json') { $zipItems += 'release\manifest.json' }
          Compress-Archive -Path $zipItems -DestinationPath "release\$env:ZIP_NAME" -CompressionLevel Optimal
          Get-Item "release\$env:ZIP_NAME" | Select-Object Name, Length
          (Get-FileHash "release\$env:ZIP_NAME" -Algorithm SHA256).Hash

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: personal-data-workbench-windows
          path: release/*.zip
          retention-days: 14

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = "${{ github.ref_name }}"
          $asset = "release\$env:ZIP_NAME"
          $files = @($asset)
          if (Test-Path 'release\manifest.json') { $files += 'release\manifest.json' }
          Get-ChildItem 'release' -Filter *.zip | ForEach-Object {
            if ($_.Name -ne $env:ZIP_NAME) { $files += $_.FullName }
          }
          Write-Host ("上传文件: " + ($files -join ', '))
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag $files --clobber
          } else {
            gh release create $tag $files --title $tag --generate-notes
          }

